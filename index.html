<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Lovely – nơi chia sẻ yêu thương.">
    <title>Trung Thu</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Mali:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
        rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            overflow: hidden;
        }

        body {
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(to top, rgb(6, 0, 20), #00020a);
            color: #fff;
            min-height: 100vh;
            position: relative;
        }

        #starfield {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            display: block;
            pointer-events: none;
        }

        .moon {
            position: fixed;
            top: 50px;
            right: 80px;
            width: 120px;
            height: 120px;
            background: radial-gradient(
                circle at 30% 30%,
                #fff,
                #ddd 70%
            );
            border-radius: 50%;
            box-shadow:
                0 0 30px rgba(255, 255, 200, .8),
                0 0 60px rgba(255, 255, 180, .6),
                0 0 90px rgba(255, 255, 150, .4);
            z-index: 0;
            pointer-events: none;
        }

        #lantern-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .lantern {
            position: absolute;
            bottom: 0;
            width: 40px;
            opacity: .9;
            user-select: none;
            will-change: transform, opacity;
            filter: drop-shadow(0 0 6px rgba(255, 150, 50, .7));
            cursor: pointer;
        }

        #message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            width: 80%;
            padding: 0 16px;
            font-size: 2rem;
            font-weight: 600;
            line-height: 1.3;
            color: #d97706;
            font-family: "Mali", cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            text-align: center;
            pointer-events: none;
        }

        .word {
            display: inline-block;
            opacity: 0;
            transform: translateY(20px);
            margin: 0 6px;
            transition:
                opacity .6s ease-out,
                transform .6s ease-out;
        }

        .word.show {
            opacity: 1;
            transform: translateY(0);
        }

        .word.hide {
            opacity: 0;
            transform: translateY(-20px);
        }

        #invite-box {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            font-family: "Mali", cursive;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255, 255, 255, .6);
            text-align: center;
            z-index: 10001;
            animation: popupScale .5s ease;
        }

        @keyframes popupScale {
            from {
                transform: translate(-50%, -50%) scale(.6);
                opacity: 0;
            }

            to {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        #invite-box p {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #d97706;
            text-shadow: 0 0 6px rgba(244, 255, 150, .6);
        }

        #invite-box button {
            border: none;
            outline: none;
            padding: 10px 20px;
            margin: 20px 0;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            transition:
                transform .2s,
                box-shadow .2s;
            font-family: "Mali", cursive;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: nowrap;
        }

        #btn-ok {
            background: linear-gradient(135deg, #47ffb2, #096332);
            color: #fff;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(255, 180, 70, .6);
        }

        #btn-ok:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 18px rgba(255, 180, 70, .8);
        }

        #btn-no {
            background: linear-gradient(135deg, #ff6b6b, #ff4e50);
            color: #fff;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(255, 100, 100, .6);
        }

        #btn-no:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 18px rgba(255, 100, 100, .8);
        }

        #wish-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, .9);
            color: #d97706;
            font-family: "Mali", cursive;
            padding: 40px 25px;
            border-radius: 12px;
            font-size: 1.5rem;
            font-weight: bold;
            display: none;
            z-index: 10000;
            box-shadow: 0 0 15px rgba(255, 255, 255, .7);
            text-align: center;
            max-width: 90vw;
        }

        #hint {
            position: fixed;
            top: 70%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff6b2;
            text-shadow: 0 0 10px rgba(255, 255, 200, .9);
            z-index: 10001;
            opacity: 0;
            transition: opacity 1s ease;
            white-space: pre-line;
            text-align: center;
        }

        @keyframes shake {
            0%   { transform: translateX(0); }
            20%  { transform: translateX(-5px); }
            40%  { transform: translateX(5px); }
            60%  { transform: translateX(-5px); }
            80%  { transform: translateX(5px); }
            100% { transform: translateX(0); }
        }

        .shake {
            animation: shake .5s;
        }

        #skywatchers {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            max-width: 90%;
            z-index: 9999999;
            opacity: .8;
            pointer-events: none;
            user-select: none;
        }

        @media (max-width: 600px) {
            .moon {
                top: 20px;
                right: 20px;
                width: 70px;
                height: 70px;
                box-shadow:
                    0 0 15px rgba(255, 255, 200, .8),
                    0 0 30px rgba(255, 255, 180, .6),
                    0 0 50px rgba(255, 255, 150, .4);
            }

            #message {
                font-size: 1.6rem;
                padding: 0 12px;
            }

            #invite-box {
                width: 60vw;
                padding: 25px 20px;
                font-size: 1.2rem;
            }

            #invite-box p {
                font-size: 1.4rem;
            }

            #invite-box button {
                padding: 10px 12px;
                font-size: 1rem;
            }

            #wish-popup {
                padding: 20px 15px;
                font-size: 1.2rem;
            }

            #hint {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

    <canvas id="starfield"></canvas>

    <div class="moon"></div>

    <div id="message"></div>

    <div id="lantern-container"></div>

    <div id="invite-box">
        <p>Đi chơi với anh nhé?</p>

        <div class="btn-group">
            <button id="btn-ok">Ok</button>
            <button id="btn-no">Không</button>
        </div>
    </div>

    <div id="wish-popup"></div>

    <img
        src="as.png"
        alt="Couple watching sky"
        id="skywatchers"
    >

    <audio id="bg-music" loop>
        <source src="a.mp3" type="audio/mp3">
    </audio>

    <script>
        const bgMusic = document.getElementById("bg-music");
        let musicStarted = false;

        document.addEventListener("click", () => {
            if (!musicStarted) {
                bgMusic.play().catch(err => {
                    console.log("Không phát được nhạc:", err);
                });

                musicStarted = true;
            }
        });
    </script>

    <script src="./script.js"></script>

</body>
</html>
